<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: 'BIZ UDPGothic', 'Yu Gothic', sans-serif; color: #2A211A; background: #1E1610">

    <span>ランチ</span>
    <span>中休み</span>
    <span>ディナー</span>
    <span>閉店</span>

  <div role="alert" style="position: absolute; left: 372px; top: 62px; width: 536px; height: 54px; transform: rotate(-1.2deg); filter: drop-shadow(0 4px 6px rgba(20,10,0,{{shadow}}))">
    <div style="width: 100%; height: 100%; background-color: #DD7D2C; background-image: linear-gradient(175deg, rgba(255,230,190,0.22) 0%, rgba(255,230,190,0) 45%, rgba(70,25,0,0.22) 100%); clip-path: polygon(1.5% 0, 0 22%, 1.2% 48%, 0 76%, 1.5% 100%, 98.5% 100%, 100% 74%, 98.8% 50%, 100% 24%, 98.5% 0); display: flex; align-items: center; justify-content: center; gap: 14px; color: #1C1005">

    <div style="box-sizing: border-box; padding: 22px 16px 12px 30px; background-color: {{paper}}; background-image: linear-gradient(170deg, rgba(255,248,230,0.2) 0%, rgba(255,248,230,0) 40%, rgba(60,35,10,0.14) 100%), repeating-linear-gradient(to bottom, transparent 0, transparent 29px, rgba(110,140,165,0.45) 29px, rgba(110,140,165,0.45) 30px); background-position: 0 0, 0 48px; border-left: 2px solid rgba(190,110,100,0.6); clip-path: polygon(0 0, 100% 0, 100% 100%, 92% 98%, 80% 100%, 66% 97%, 50% 100%, 36% 98%, 20% 100%, 8% 97%, 0 100%); font-family: 'Yusei Magic', sans-serif; font-size: 18px; line-height: 30px">

      <div style="display: flex; gap: 10px"><span style="width: 92px">店主</span><span style="padding: 0 6px; background: rgba(221,125,44,0.55); color: #1C1005">熱湯！</span></div>
      <div style="display: flex; gap: 10px"><span style="width: 92px">おかみさん</span><span style="color: #5B4D3F">仕込み中</span></div>
      <div style="display: flex; gap: 10px"><span style="width: 92px">バイト</span><span style="color: #5B4D3F">2Fで休憩</span></div>
    </div>
  </div>

  <!-- 巣の方向：床に刺さった爪楊枝の旗（床に影を落とす） -->
  <div style="position: absolute; left: 604px; top: 150px; width: 110px; height: 100px">

    <span style="position: absolute; left: 4px; top: 0; width: 3px; height: 92px; border-radius: 2px; background: #B8935E"></span>
    <span style="position: absolute; left: 7px; top: 4px; height: 30px; padding: 0 16px 0 8px; background-color: {{paper}}; background-image: linear-gradient(180deg, rgba(255,248,230,0.2), rgba(60,35,10,0.14)); clip-path: polygon(0 0, 100% 0, 88% 50%, 100% 100%, 0 100%); display: flex; align-items: center; gap: 5px; font-family: 'Yusei Magic', sans-serif; font-size: 17px; color: #1F1712; white-space: nowrap"><span style="width: 10px; height: 10px; background: #9DB23A; border: 1.5px solid #2A211A"></span>巣 18m</span>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 88px; transform: translateY(-2px)">
        <span style="position: relative; width: 72px; height: 72px; filter: drop-shadow(0 3px 3px rgba(20,10,0,0.5))">

          <span style="position: absolute; left: 0; top: 20px; width: 72px; text-align: center; font-family: 'Dela Gothic One', sans-serif; font-size: 22px; line-height: 1; color: #2A211A">Lv1</span>
        </span>
        <span style="font-size: 15px; font-weight: 700; color: #1E150C">巣</span>
      </div>
    </div>
    <div style="position: absolute; left: 16px; top: 116px; width: 320px; height: 36px; transform: rotate(1deg); background: rgba(214,196,140,0.85); clip-path: polygon(1.5% 0, 0 50%, 1.5% 100%, 98.5% 100%, 100% 50%, 98.5% 0); display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; font-size: 15px; font-weight: 700">
      <span style="min-width: 24px; height: 24px; border-radius: 5px; background: #2A211A; color: #E2D6BE; border-bottom: 3px solid #0E0905; display: flex; align-items: center; justify-content: center; font-size: 14px">5</span>
      <span style="font-family: 'Yusei Magic', sans-serif; font-size: 17px; font-weight: 400">占拠 → 「□」区域へ</span>
      <span style="margin-left: auto; font-size: 12px; color: #4A3D30">Tab 軍団</span>
    </div>
  </div>

  <!-- 画面全体の仕上げ：ゲームとUIに同じ光・粒子・周辺減光をかける -->
  <sc-if value="{{grade}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; pointer-events: none; background: #F0D3A4; mix-blend-mode: multiply; opacity: 0.16"></div>
    <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 52% 46%, rgba(20,10,0,0) 55%, rgba(20,10,0,0.42) 100%)"></div>
    <svg width="1280" height="720" style="position: absolute; left: 0; top: 0; pointer-events: none; mix-blend-mode: overlay; opacity: 0.28" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1280" height="720" filter="url(#grain)"></rect></svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paper":{"editor":"color","default":"#DCCFB4","options":["#DCCFB4","#E8DEC8","#F4EFE4"]},"shadow":{"editor":"range","default":0.55,"min":0.2,"max":0.8,"step":0.05},"grade":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      paper: this.props.paper ?? '#DCCFB4',
      shadow: this.props.shadow ?? 0.55,
      grade: this.props.grade ?? true
    };
  }
}
</script>
